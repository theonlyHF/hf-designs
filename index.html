<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11151d">
  <meta name="description" content="Portfólio HF Designs. Pôsteres, estampas, identidades visuais e banners para YouTube e Twitch.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="HF Designs — Portfólio de design">
  <meta property="og:description" content="Pôsteres, estampas, identidades visuais e banners para YouTube e Twitch.">
  <link rel="canonical" href="https://theonlyhf.github.io/hf-designs/">
  <meta property="og:url" content="https://theonlyhf.github.io/hf-designs/">
  <meta property="og:image" content="https://theonlyhf.github.io/hf-designs/assets/hf-social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="630">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo HF Designs em branco sobre fundo escuro">
  <title>HF Designs — Portfólio de design</title>
  <link rel="icon" href="assets/hf-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=12">
  <script defer src="data/designs.js"></script>
  <script defer src="data/covers.js"></script>
  <script defer src="data/home.js"></script>
  <script defer src="js/glitch.js"></script>
  <script defer src="js/audio.js?v=4"></script>
  <script defer src="js/catalog-live.js?v=2"></script>
  <script defer src="data/thumbnails.js?v=1"></script>
  <script defer src="js/main.js?v=12"></script>
</head>
<body>
  <div class="room">
  <div class="rig">
  <div class="monitor">
    <div class="bezel">
      <div class="crt-screen">
        <div class="screen-scroll" inert>
          <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
          <header class="site-header">
            <div class="shell header-inner">
              <a class="wordmark" href="#/" aria-label="HF Designs, início">
                <img src="assets/hf-mark.svg" width="37" height="25" alt="">
              </a>
              <nav aria-label="Navegação principal">
                <a href="#/" aria-current="page">Início</a>
                <a href="#/contato">Contato</a>
              </nav>
            </div>
          </header>
          <main class="shell" id="conteudo" tabindex="-1">
            <noscript><p>Ative o JavaScript para navegar pelo portfólio HF Designs.</p></noscript>
          </main>
        </div>
        <canvas id="transition" aria-hidden="true" hidden></canvas>
        <div class="eject-overlay" role="status" hidden>
          <div class="eject-display">
            <span class="disc-surface eject-disc" aria-hidden="true"></span>
            <span class="eyebrow">Ejetando CD…</span>
            <span class="eject-progress" aria-hidden="true"></span>
          </div>
        </div>
        <div class="site-intro" hidden>
          <div class="intro-sweep" aria-hidden="true"></div>
          <img class="intro-logo" src="assets/hf-mark.svg" width="80" height="54" alt="" fetchpriority="high">
        </div>
      </div>
    </div>
    <div class="monitor-panel" aria-hidden="true">
      <div class="speaker"></div>
      <div class="tv-controls">
        <span class="av-inputs"><i></i><i></i><i></i></span>
        <span class="power-light"></span><span class="power-button">⏻</span>
      </div>
      <div class="speaker"></div>
    </div>
  </div>
  <div class="console">
    <div class="console-top" aria-hidden="true">
      <div class="console-jacks"><i></i><i></i><i></i></div>
      <div class="console-lid"><img src="assets/hf-mark.svg" width="43" height="30" alt=""></div>
      <div class="console-vents"></div>
    </div>
    <div class="console-actions">
      <button class="console-power" type="button" disabled><span class="console-led" aria-hidden="true"></span><span data-power-label>Ligar console</span></button>
      <button class="console-sound" type="button" aria-label="Silenciar som" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9h4l5-4v14l-5-4H3z"/>
          <path class="sound-waves" d="M16 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/>
          <path class="sound-muted" d="m16 10 5 5m0-5-5 5"/>
        </svg>
      </button>
      <details class="console-volume" hidden><summary>Volume</summary>
        <label>Trilha <input data-volume="music" type="range" min="0" max="100"></label>
        <label>Efeitos <input data-volume="effects" type="range" min="0" max="100"></label>
      </details>
    </div>
    <div class="console-ports" aria-hidden="true"><i></i><i></i></div>
  </div>
  <svg class="signal-cables" aria-hidden="true" focusable="false"><path/><path/><path/></svg>
  </div>
  </div>

  <dialog class="lightbox" aria-labelledby="viewer-title">
    <div class="viewer">
      <div class="viewer-top">
        <span class="eyebrow" data-viewer-index></span>
        <div class="viewer-nav">
          <button type="button" data-copy>Copiar link</button>
          <button class="icon-button" type="button" data-expand aria-label="Ampliar para tela cheia" aria-pressed="false">⛶</button>
          <button class="icon-button" type="button" data-close aria-label="Fechar imagem" autofocus>×</button>
        </div>
      </div>
      <div class="viewer-image"><img alt=""></div>
      <div class="viewer-bottom">
        <div aria-live="polite">
          <h2 id="viewer-title"></h2>
          <p class="eyebrow" data-viewer-details></p>
          <p class="viewer-description" data-viewer-description hidden></p>
          <p class="viewer-description" data-viewer-role hidden></p>
          <p class="viewer-description" data-viewer-goal hidden></p>
        </div>
        <div class="viewer-nav">
          <button class="icon-button" type="button" data-prev aria-label="Imagem anterior">←</button>
          <button class="icon-button" type="button" data-next aria-label="Próxima imagem">→</button>
        </div>
      </div>
      <div class="viewer-variants" hidden>
        <span>Outras versões</span>
        <div data-variants></div>
      </div>
      <div class="viewer-compare" hidden></div>
      <span class="visually-hidden" data-link-status role="status"></span>
      <a class="viewer-contact" href="https://www.instagram.com/hf.designs01/" target="_blank" rel="noopener">Quero um design assim</a>
    </div>
  </dialog>

  <template id="home-template">
    <section class="home" aria-labelledby="page-title">
      <h1 class="visually-hidden" id="page-title" tabindex="-1">Início</h1>
      <div class="home-waves" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="coverflow" role="group" aria-label="Caixas das galerias">
        <button class="case-close icon-button" type="button" aria-label="Fechar caixa" hidden>×</button>
        <div class="case-controls">
          <button class="control-dot" type="button" data-panel="cover-options" data-tooltip="Estilo da capa" aria-label="Estilo da capa" aria-expanded="false" aria-controls="cover-options">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 3v18m3-14h5m-5 10h5"/></svg>
          </button>
          <button class="control-dot case-turn-toggle" type="button" data-tooltip="Ver verso da capa" aria-label="Ver verso da capa" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H6a1 1 0 0 0-1 1v13h13v-6M13 4h5v5m0-5-7 7m-2 1h5m-5 3h5"/></svg>
          </button>
          <button class="control-dot" type="button" data-panel="visual-options" data-tooltip="Fundo e TV" aria-label="Fundo e TV" aria-expanded="false" aria-controls="visual-options">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M7 21h10m-5-3v3m-6-8 3-3 3 3 3-2"/></svg>
          </button>
          <div class="case-options" id="cover-options" role="group" aria-label="Formato da capa" hidden>
            <button type="button" data-style="square" aria-pressed="true">Quadrada</button>
            <button type="button" data-style="vertical" aria-pressed="false">Vertical</button>
          </div>
          <div class="case-options" id="visual-options" role="group" aria-label="Fundo e TV" hidden>
            <fieldset><legend>Fundo</legend>
              <button type="button" data-theme="site" aria-pressed="true">Padrão do site</button>
              <button type="button" data-theme="violet" aria-pressed="false">Roxo</button>
              <button type="button" data-theme="blue" aria-pressed="false">Azul</button>
              <button type="button" data-theme="green" aria-pressed="false">Verde</button>
              <button type="button" data-theme="core" aria-pressed="false">Núcleo verde</button>
              <button type="button" data-theme="orbit" aria-pressed="false">Órbitas</button>
            </fieldset>
            <fieldset><legend>TV de tubo</legend>
              <button type="button" data-crt="silver" aria-pressed="true">Prateada</button>
              <button type="button" data-crt="graphite" aria-pressed="false">Grafite</button>
              <button type="button" data-crt="ivory" aria-pressed="false">Marfim</button>
            </fieldset>
            <button class="motion-toggle" type="button" aria-pressed="false" hidden>Movimento 3D</button>
          </div>
        </div>
        <div class="carousel-nav" role="group" aria-label="Navegação das capas">
          <button type="button" data-step="-1" aria-label="Capa anterior">←</button>
          <output aria-live="polite"></output>
          <button type="button" data-step="1" aria-label="Próxima capa">→</button>
        </div>
        <a class="open-gallery" hidden>Abrir galeria</a>
        <div class="gesture-hint" hidden>Deslize, role ou use as setas para mudar de capa. <button type="button">Entendi</button></div>
      </div>
    </section>
  </template>

  <template id="channel-template">
    <section class="gallery-page channel-page" aria-labelledby="page-title">
      <div class="gallery-toolbar"><h1 id="page-title" tabindex="-1">Meu canal</h1><button class="eject-button" type="button"><span aria-hidden="true">⏏</span> Ejetar CD</button></div>
      <img src="assets/designs/hf-banner-youtube.png" alt="Arte do banner do canal HF Designs">
      <p></p>
      <a class="eject-button" hidden>Abrir no YouTube</a>
    </section>
  </template>

  <template id="cover-template">
    <div class="game-cover">
      <span class="case-hit" aria-hidden="true"></span>
      <span class="case-model">
        <span class="case-back">
          <img class="case-back-art" alt="" draggable="false" decoding="async">
          <span class="case-back-copy">
            <img src="assets/hf-mark.svg" width="36" height="25" alt="" draggable="false">
            <strong></strong>
            <span class="case-summary"></span>
          </span>
        </span>
        <span class="case-edge case-edge-left" aria-hidden="true"></span>
        <span class="case-edge case-edge-right" aria-hidden="true"></span>
        <span class="case-tray">
          <a class="disc-surface disc-link" draggable="false" tabindex="-1" aria-hidden="true">
            <img class="disc-art" alt="" draggable="false" decoding="async" hidden>
            <img class="disc-mark" src="assets/hf-mark.svg" width="47" height="32" alt="" draggable="false">
            <strong class="disc-title"></strong>
          </a>
        </span>
        <span class="case-lid">
          <button class="case-trigger" type="button" aria-expanded="false" draggable="false">
            <span class="cover-spine" aria-hidden="true"><span class="spine-brand">HF Designs</span></span>
            <span class="cover-front">
              <span class="cover-edition" aria-hidden="true"><img src="assets/hf-mark.svg" width="36" height="24" alt="" draggable="false"><span class="edition-brand">HF Designs</span></span>
              <span class="cover-art">
                <img alt="" draggable="false" decoding="async">
                <span class="cover-center" aria-hidden="true" hidden>
                  <svg class="cover-center-logo" viewBox="0 0 80 54" focusable="false">
                    <path d="M4.5 11.25h17.25a1 1 0 0 1 1 1V26.5h1V12.25a1 1 0 0 1 1-1H42a1 1 0 0 1 1 1v39.5a1 1 0 0 1-1 1H24.75a1 1 0 0 1-1-1V38.5h-1v13.25a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1v-39.5a1 1 0 0 1 1-1Z"/>
                    <path d="M45.5 11.25h30a1 1 0 0 1 1 1V26a1 1 0 0 1-1 1H64v1.25h11.5a1 1 0 0 1 1 1v8.5a1 1 0 0 1-1 1H64v13a1 1 0 0 1-1 1H45.5a1 1 0 0 1-1-1v-39.5a1 1 0 0 1 1-1Z"/>
                    <text x="70.75" y="7.5" text-anchor="end" font-family="monospace" font-size="4.7" letter-spacing="1.2">DESIGNS</text>
                  </svg>
                  <span class="cover-center-text"></span>
                </span>
                <svg class="cover-youtube" viewBox="0 0 48 34" aria-hidden="true"><rect width="48" height="34" rx="9" fill="#ff2537"/><path d="m19 9 14 8-14 8z" fill="#fff"/></svg>
                <strong></strong>
              </span>
            </span>
          </button>
          <span class="case-liner" aria-hidden="true"></span>
        </span>
      </span>
    </div>
  </template>

  <template id="gallery-template">
    <section class="gallery-page" aria-labelledby="page-title">
      <h1 class="visually-hidden" id="page-title" tabindex="-1"></h1>
      <div class="gallery-toolbar">
        <div class="filters" role="group" aria-label="Filtrar por ano"></div>
        <div class="gallery-controls">
          <p class="eyebrow result-count" role="status" aria-live="polite" aria-atomic="true"></p>
          <button class="eject-button" type="button"><span aria-hidden="true">⏏</span> Ejetar CD</button>
        </div>
      </div>
      <div class="gallery-search">
        <label>Buscar <input type="search" placeholder="Título, categoria ou ano"></label>
        <button type="button" data-clear>Limpar filtros</button>
        <button type="button" data-share>Copiar link da galeria</button>
        <span class="visually-hidden" role="status"></span>
      </div>
      <div class="gallery" id="galeria"></div>
    </section>
  </template>

  <template id="contact-template">
    <section class="contact-page" aria-labelledby="page-title">
      <h1 class="visually-hidden" id="page-title" tabindex="-1">Contato</h1>
      <ul class="contact-links">
        <li><a href="https://discord.gg/fCq5MfF49" aria-label="Discord">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.248a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.248.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.045-.32 13.58.099 18.057a.083.083 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.042-.106 13 13 0 0 1-1.87-.892.077.077 0 0 1-.008-.127c.126-.095.251-.193.371-.293a.074.074 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.06 0a.074.074 0 0 1 .079.01c.12.1.245.198.372.293a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.871.891.077.077 0 0 0-.041.107c.36.698.771 1.362 1.224 1.993a.076.076 0 0 0 .084.029 19.86 19.86 0 0 0 6.002-3.03.077.077 0 0 0 .031-.056c.5-5.177-.839-9.674-3.548-13.66a.061.061 0 0 0-.031-.028ZM8.02 15.33c-1.182 0-2.156-1.085-2.156-2.419 0-1.334.956-2.419 2.156-2.419 1.21 0 2.175 1.094 2.156 2.419 0 1.334-.956 2.419-2.156 2.419Zm7.974 0c-1.182 0-2.156-1.085-2.156-2.419 0-1.334.956-2.419 2.156-2.419 1.21 0 2.174 1.094 2.156 2.419 0 1.334-.947 2.419-2.156 2.419Z"/>
          </svg>
        </a></li>
        <li><a href="https://www.instagram.com/hf.designs01/" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4.2"/>
            <circle cx="17.8" cy="6.25" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
        </a></li>
      </ul>
    </section>
  </template>
</body>
</html>
